<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Will You Go On A Date With Me Raina? 💖</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Floating hearts background container -->
  <div id="hearts-bg"></div>

  <!-- Background Romantic Audio -->
  <audio id="romantic-bgm" preload="auto" loop>
    <source src="assets/romantic.mp3" type="audio/mpeg">
  </audio>

  <!-- Top Floating Navigation (Only Music Toggle Kept) -->
  <header class="top-nav">
    <button id="music-toggle-btn" class="nav-btn">🎵 Music: OFF</button>
  </header>

  <!-- Main Interactive App Wrapper -->
  <main class="app-wrapper">

    <!-- ==========================================
         STEP 1: THE PROPOSAL (YES / RUNAWAY NO)
         ========================================== -->
    <section id="step-1-proposal" class="step-container glass-card">
      <div class="step-header">
        <div class="top-badge-row" style="justify-content: center;">
          <span class="step-badge">Question of the Century 🌹</span>
        </div>
        <span id="crush-display-name" class="crush-highlight">Raina 💖</span>
        <h1 id="proposal-title" class="step-title">Will you go on a date with me? 💖</h1>
      </div>

      <!-- Animated SVG Character -->
      <div class="character-box" id="character-display"></div>

      <!-- Yes / No Buttons -->
      <div class="proposal-box">
        <div class="button-arena" id="button-arena">
          <button id="yes-btn" class="btn-primary">YES! Absolutely 🥰</button>
          <button id="no-btn" class="btn-no">No 🙈</button>
        </div>
      </div>
    </section>


    <!-- ==========================================
         STEP 2: CELEBRATION SCREEN (FINAL SCREEN)
         ========================================== -->
    <section id="step-2-celebration" class="step-container glass-card hidden">
      <div class="step-header">
        <span class="step-badge">WOOHOO! 🎉</span>
        <h1 id="celeb-title" class="step-title">YAAAY! I Knew You'd Say Yes! 🎉</h1>
        <p id="celeb-sub" class="step-subtitle">I can't wait to take you out! 💖✨</p>
      </div>

      <div class="character-box" id="celebration-character"></div>
    </section>

  </main>

  <!-- Original Scripts for Effects, Confetti, Character, and Runaway Button -->
  <script src="js/config.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/character.js"></script>
  <script src="js/runaway.js"></script>
  <script src="js/app.js"></script>

  <!-- Override script to ensure js/config.js doesn't overwrite Raina's name or subtitle -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const nameEl = document.getElementById('crush-display-name');
        if (nameEl) nameEl.textContent = 'Raina 💖';
        
        const subEl = document.getElementById('celeb-sub');
        if (subEl) subEl.textContent = "I can't wait to take you out! 💖✨";
      }, 50);
    });
  </script>
</body>
</html>
